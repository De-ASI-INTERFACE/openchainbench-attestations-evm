name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check foundry.toml exists
        run: |
          if [ ! -f foundry.toml ]; then
            echo "foundry.toml not found"
            exit 1
          fi
          echo "✓ foundry.toml exists"

      - name: Check contract source exists
        run: |
          if [ ! -f src/OpenChainBenchAttestations.sol ]; then
            echo "Contract source not found"
            exit 1
          fi
          echo "✓ Contract source exists"

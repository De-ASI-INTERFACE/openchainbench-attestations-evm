name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Cache Foundry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry
            ~/.forge
          key: ${{ runner.os }}-foundry-${{ hashFiles('foundry.toml', 'remappings.txt') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Cache Solidity artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-solidity-${{ hashFiles('src/**/*.sol', 'test/**/*.sol') }}
          restore-keys: |
            ${{ runner.os }}-solidity-

      - name: Install dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: Build
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv --gas-report

      - name: Check formatting
        run: forge fmt --check

      - name: Verify artifacts
        run: |
          if [ ! -f out/OpenChainBenchAttestations.sol/OpenChainBenchAttestations.json ]; then
            echo "Contract artifact not generated"
            exit 1
          fi
          if [ ! -f out/OpenChainBenchAttestations.sol/OpenChainBenchAttestations.abi.json ]; then
            echo "ABI not generated"
            exit 1
          fi
          echo "All artifacts generated successfully"
